replicaCount: 1

image:
  repository: cthnn-portfolio-backend
  tag: latest
  pullPolicy: Never

imagePullSecrets: []

service:
  type: ClusterIP
  port: 8000

env:
  corsOrigins: "https://cthnn.dev"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: api.cthnn.dev
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: backend-tls

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
